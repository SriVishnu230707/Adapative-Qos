&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();
&lt;/script&gt;

&lt;script&gt;
(()=&gt;{
  const root=document.getElementById(&#x27;cn-learning-map&#x27;);
  const sources={
    basics:[&#x27;Protocol practice: Kurose &amp; Ross labs&#x27;,&#x27;https://gaia.cs.umass.edu/kurose_ross/wireshark.php&#x27;],
    namespaces:[&#x27;Linux network namespaces&#x27;,&#x27;https://man7.org/linux/man-pages/man7/network_namespaces.7.html&#x27;],
    hooks:[&#x27;Linux packet path: Netfilter hooks&#x27;,&#x27;https://wiki.nftables.org/wiki-nftables/index.php/Netfilter_hooks&#x27;],
    marks:[&#x27;Linux packet and connection marks&#x27;,&#x27;https://wiki.nftables.org/wiki-nftables/index.php/Setting_packet_metainformation&#x27;],
    tcp:[&#x27;TCP congestion control: RFC 5681&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc5681.html&#x27;],
    quic:[&#x27;QUIC overview: RFC 9000&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc9000.html&#x27;],
    jitter:[&#x27;Delay variation: RFC 5481&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc5481.html&#x27;],
    queues:[&#x27;Queuing disciplines: Systems Approach&#x27;,&#x27;https://book.systemsapproach.org/congestion/queuing.html&#x27;],
    aqm:[&#x27;Active queue management: RFC 7567&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc7567.html&#x27;],
    ecn:[&#x27;Congestion notification: RFC 3168&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc3168.html&#x27;],
    fq:[&#x27;FQ-CoDel: RFC 8290&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc8290.html&#x27;],
    tc:[&#x27;Linux traffic control reference&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc.8&#x27;],
    tbf:[&#x27;Token Bucket Filter reference&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc-tbf.8&#x27;],
    htb:[&#x27;HTB reference&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc-htb.8&#x27;],
    cake:[&#x27;CAKE reference&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc-cake.8&#x27;],
    ifb:[&#x27;Ingress redirection and IFB&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc-mirred.8&#x27;],
    dscp:[&#x27;DiffServ service classes: RFC 4594&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc4594.html&#x27;],
    iperf:[&#x27;iperf3 documentation&#x27;,&#x27;https://software.es.net/iperf/invoking.html&#x27;],
    flent:[&#x27;Flent load and latency tests&#x27;,&#x27;https://flent.org/tests.html&#x27;],
    netem:[&#x27;netem reference&#x27;,&#x27;https://github.com/iproute2/iproute2/blob/main/man/man8/tc-netem.8&#x27;],
    tests:[&#x27;AQM evaluation: RFC 7928&#x27;,&#x27;https://www.rfc-editor.org/rfc/rfc7928.html&#x27;],
    autorate:[&#x27;Study an existing adaptive controller&#x27;,&#x27;https://github.com/lynxthecat/cake-autorate&#x27;]
  };
  const sections=[
    {id:&#x27;foundations&#x27;,label:&#x27;1. Foundations&#x27;,title:&#x27;Start with the packet journey&#x27;,intro:&#x27;A computer network lets programs exchange information through links and forwarding devices. Begin with what a packet is, then follow it from an application to a remote application. Each later topic will attach to a part of this journey.&#x27;,example:&#x27;Your laptop sends a request to a server through a home router. The reply must find a working return path.&#x27;,practice:&#x27;Draw a laptop, switch or access point, router, ISP and server. Label the links and identify which devices forward frames or packets.&#x27;,check:&#x27;What must work before your QoS controller can improve anything?&#x27;,answer:&#x27;A valid end-to-end path in both directions. A priority rule cannot repair a missing route or disconnected link.&#x27;,connection:&#x27;Defines the devices, edge, network and applications in your project architecture.&#x27;,source:&#x27;basics&#x27;,items:[
      [&#x27;network&#x27;,&#x27;What is a network?&#x27;,&#x27;A network connects programs and devices&#x27;,&#x27;A network is a set of connected devices that exchange information using agreed rules called protocols. Links carry signals; hosts run applications; forwarding devices move traffic toward its destination. A connection can work without public Internet access.&#x27;,&#x27;A client and server inside one Linux computer can communicate through virtual links.&#x27;,&#x27;Name the hosts, links and forwarding devices in your proposed lab.&#x27;,&#x27;Does every network require the Internet?&#x27;,&#x27;No. A private or virtual network can connect its own hosts without a public Internet connection.&#x27;,[],[&#x27;lan-wan&#x27;,&#x27;linux-lab&#x27;],&#x27;basics&#x27;],
      [&#x27;packets&#x27;,&#x27;Packets &amp; switching&#x27;,&#x27;Large messages travel as smaller units&#x27;,&#x27;Applications produce data that the network carries in packets. Packet switching lets many communications share a link over time. A forwarding device may temporarily queue a packet when its outgoing link is busy. Packets are not guaranteed to arrive together or with identical delay.&#x27;,&#x27;A large download creates many packets. A small call packet can arrive while those packets are waiting.&#x27;,&#x27;Sketch two senders sharing one outgoing link and show where a queue could form.&#x27;,&#x27;Why can a small message wait behind a large transfer?&#x27;,&#x27;They may share a busy link and queue. The scheduling and queue-management rules determine how they compete.&#x27;,[&#x27;network&#x27;],[&#x27;bufferbloat&#x27;,&#x27;scheduling&#x27;],&#x27;queues&#x27;],
      [&#x27;client-server&#x27;,&#x27;Clients &amp; servers&#x27;,&#x27;Applications occupy the ends of the path&#x27;,&#x27;A client initiates an application exchange and a server provides a service. These are roles, not fixed types of computer. A host can run both roles. The network transports their packets; it does not automatically understand what the application considers important.&#x27;,&#x27;An iperf3 server receives test traffic from an iperf3 client.&#x27;,&#x27;Identify the client and server for a download and for your test workload.&#x27;,&#x27;Can one laptop be both client and server?&#x27;,&#x27;Yes. Different processes on the same host can take different roles.&#x27;,[&#x27;network&#x27;],[&#x27;ports&#x27;,&#x27;tools&#x27;],&#x27;basics&#x27;],
      [&#x27;lan-wan&#x27;,&#x27;LAN, WAN &amp; Internet&#x27;,&#x27;Your gateway sits between different networks&#x27;,&#x27;A LAN connects nearby devices under local administration. A WAN connects networks over a wider area. The Internet interconnects many networks. Your home gateway connects a local network to an access connection, but a bottleneck may exist on either side or farther along the path.&#x27;,&#x27;Excellent Wi-Fi does not remove a congested ISP link; excellent WAN capacity does not remove Wi-Fi interference.&#x27;,&#x27;Mark the LAN, gateway and emulated WAN on your topology.&#x27;,&#x27;Where should you look if only wireless clients perform badly?&#x27;,&#x27;Investigate the wireless link and local conditions before assuming that the WAN queue is responsible.&#x27;,[&#x27;network&#x27;],[&#x27;devices&#x27;,&#x27;bottlenecks&#x27;],&#x27;basics&#x27;],
      [&#x27;layers&#x27;,&#x27;Network layers&#x27;,&#x27;Layers separate different responsibilities&#x27;,&#x27;Use the TCP/IP model: application, transport, Internet and link. Applications define meaning; transport supports communication between processes; IP moves packets across networks; the link moves data to a neighbouring interface. The OSI model adds detail, but the packet path matters more than memorizing names.&#x27;,&#x27;HTTP data can travel through TCP, inside IP, inside an Ethernet frame.&#x27;,&#x27;Place HTTP, TCP, UDP, IP and Ethernet into their layers.&#x27;,&#x27;Which layer normally selects the next router?&#x27;,&#x27;The Internet or network layer uses IP routing. Ethernet only reaches a neighbour on the current link.&#x27;,[&#x27;packets&#x27;],[&#x27;encapsulation&#x27;,&#x27;routing&#x27;],&#x27;basics&#x27;],
      [&#x27;encapsulation&#x27;,&#x27;Encapsulation&#x27;,&#x27;Headers carry instructions for different layers&#x27;,&#x27;Each layer wraps data with information needed for its job. Ethernet uses link addresses; IP uses network addresses; TCP and UDP use ports. A router forwards an IP packet onto a new link with a new link-layer frame. NAT may also change selected IP or transport fields.&#x27;,&#x27;The destination MAC on a remote-server request is initially the gateway MAC, while the destination IP is the server IP.&#x27;,&#x27;Draw frame, IP packet and TCP segment as nested boxes and label their addresses.&#x27;,&#x27;Does a remote server’s MAC address travel across every router?&#x27;,&#x27;No. Link-layer addressing is used for the current link and changes as routers forward onto other links.&#x27;,[&#x27;layers&#x27;],[&#x27;ethernet&#x27;,&#x27;nat&#x27;],&#x27;basics&#x27;],
      [&#x27;devices&#x27;,&#x27;Switch, router &amp; AP&#x27;,&#x27;Different forwarding devices make different decisions&#x27;,&#x27;A switch or bridge forwards Ethernet frames within a link-layer network. A router forwards IP packets between networks. An access point connects wireless clients to a LAN. One home box can combine all these roles plus NAT, DHCP and firewall functions.&#x27;,&#x27;Your Linux gateway needs routing and queueing; it does not have to emulate a Wi-Fi radio.&#x27;,&#x27;Split the features of a home router into switching, routing, wireless and services.&#x27;,&#x27;Is a switch’s forwarding decision the same as a router’s?&#x27;,&#x27;No. A typical Ethernet switch uses MAC information; a router uses an IP routing table.&#x27;,[&#x27;layers&#x27;],[&#x27;ethernet&#x27;,&#x27;routing&#x27;,&#x27;veth&#x27;],&#x27;basics&#x27;],
      [&#x27;journey&#x27;,&#x27;Follow one packet&#x27;,&#x27;Connect all the layers in one explanation&#x27;,&#x27;A program writes data to a socket. Transport adds its information, IP selects a route, neighbour discovery identifies the local next hop, and the interface transmits. Routers repeat forwarding decisions. The destination delivers data to the intended process. Replies need their own valid path.&#x27;,&#x27;A test packet travels from a client namespace through your gateway namespace to a server namespace.&#x27;,&#x27;Explain the outward and return journey without looking at notes.&#x27;,&#x27;At what point could your project delay or prioritize this packet?&#x27;,&#x27;At an enforcement point through which it actually passes, such as an outgoing gateway queue.&#x27;,[&#x27;encapsulation&#x27;,&#x27;devices&#x27;],[&#x27;linux-lab&#x27;,&#x27;ingress&#x27;,&#x27;tc-objects&#x27;],&#x27;hooks&#x27;]
    ]},
    {id:&#x27;addressing&#x27;,label:&#x27;2. Links &amp; IP&#x27;,title:&#x27;Make the path work&#x27;,intro:&#x27;Connect local delivery to IP routing. Learn how a host chooses a next hop, how it discovers that neighbour, and how addresses or packet sizes can change along the path.&#x27;,example:&#x27;A client has a correct IP address but no route back from the server. The request may arrive while the reply fails.&#x27;,practice:&#x27;Build two subnets joined by a Linux gateway. Verify both directions before adding shaping.&#x27;,check:&#x27;Why is a successful ping to the gateway insufficient?&#x27;,answer:&#x27;It proves only part of the path. Forwarding, remote routes, filtering and the return route may still fail.&#x27;,connection:&#x27;Makes traffic traverse the gateway and keeps IPv4/IPv6 classification and device identity meaningful.&#x27;,source:&#x27;basics&#x27;,items:[
      [&#x27;ethernet&#x27;,&#x27;Ethernet &amp; MAC&#x27;,&#x27;Local delivery uses link addresses&#x27;,&#x27;Ethernet frames use MAC addresses for delivery across a local link. A bridge learns where source MAC addresses appear and uses that information for forwarding. Broadcast and unknown destinations behave differently from known unicast. MAC identity is local to the link, not an Internet-wide route.&#x27;,&#x27;The laptop addresses an off-subnet packet’s frame to its gateway.&#x27;,&#x27;Inspect a test frame’s source and destination MAC addresses.&#x27;,&#x27;Why can the frame target the gateway while IP targets the server?&#x27;,&#x27;The gateway is the next link-layer recipient; the server remains the IP destination.&#x27;,[&#x27;devices&#x27;,&#x27;encapsulation&#x27;],[&#x27;neighbors&#x27;,&#x27;routing&#x27;],&#x27;basics&#x27;],
      [&#x27;ipv4&#x27;,&#x27;IPv4 &amp; subnets&#x27;,&#x27;A prefix identifies a network range&#x27;,&#x27;An IPv4 address is 32 bits. CIDR notation adds a prefix length, such as /24, to identify a network range. Hosts use route information to decide whether delivery is local or requires a gateway. An address alone does not establish reachability.&#x27;,&#x27;10.0.1.10/24 and 10.0.2.20/24 normally require routing between their subnets.&#x27;,&#x27;Choose non-overlapping prefixes for the two sides of your virtual gateway.&#x27;,&#x27;Does the same first octet guarantee two hosts are on one subnet?&#x27;,&#x27;No. The prefix length and routing configuration determine the network boundaries.&#x27;,[&#x27;layers&#x27;],[&#x27;routing&#x27;,&#x27;linux-addresses&#x27;],&#x27;basics&#x27;],
      [&#x27;routing&#x27;,&#x27;Routes &amp; gateways&#x27;,&#x27;Forwarding chooses a next hop&#x27;,&#x27;A routing table maps destination prefixes to next hops and outgoing interfaces. Longest-prefix matching selects the most specific applicable route. A default route handles destinations without a more specific match. Each direction needs a usable route; enabling forwarding does not create those routes.&#x27;,&#x27;A server needs a route toward the client subnet through the gateway.&#x27;,&#x27;Inspect routes, predict a packet’s outgoing interface, then verify the prediction.&#x27;,&#x27;Can a request succeed outward while its reply fails?&#x27;,&#x27;Yes. The reverse direction may lack a route or may be blocked.&#x27;,[&#x27;ipv4&#x27;],[&#x27;forwarding&#x27;,&#x27;journey&#x27;,&#x27;nat&#x27;],&#x27;hooks&#x27;],
      [&#x27;neighbors&#x27;,&#x27;ARP &amp; neighbours&#x27;,&#x27;Resolve the next hop on the local link&#x27;,&#x27;ARP resolves IPv4 neighbours to link-layer addresses on a local link. IPv6 uses Neighbor Discovery, which also supports other local-link functions. For an off-subnet destination, the host resolves its gateway neighbour rather than discovering the remote server’s MAC.&#x27;,&#x27;The ARP table holds a gateway mapping, not the MAC of a server across the Internet.&#x27;,&#x27;Inspect neighbour entries before and after sending local test traffic.&#x27;,&#x27;Will ARP discover a remote server through several routers?&#x27;,&#x27;No. ARP operates within the local link; routers handle the onward IP path.&#x27;,[&#x27;ethernet&#x27;,&#x27;routing&#x27;],[&#x27;ipv6&#x27;,&#x27;linux-addresses&#x27;],&#x27;basics&#x27;],
      [&#x27;ipv6&#x27;,&#x27;IPv6 basics&#x27;,&#x27;IPv6 needs its own working path&#x27;,&#x27;IPv6 uses 128-bit addresses and prefix-based routing. Learn global or local addresses, link-local addresses, Neighbor Discovery and default routes. Rules and measurements must cover IPv6 where available; an IPv4-only classifier can miss another active traffic path.&#x27;,&#x27;A dual-stack application may select IPv6 even when an IPv4 rule looks correct.&#x27;,&#x27;Inspect IPv6 addresses and routes, then repeat a representative test using IPv6.&#x27;,&#x27;Does an IPv4 shaping classification rule automatically match IPv6?&#x27;,&#x27;Do not assume it does. Verify the rule family and actual packet treatment for both protocols.&#x27;,[&#x27;ipv4&#x27;,&#x27;neighbors&#x27;],[&#x27;hooks&#x27;,&#x27;reproducibility&#x27;],&#x27;basics&#x27;],
      [&#x27;dhcp&#x27;,&#x27;DHCP&#x27;,&#x27;Address configuration can be automatic&#x27;,&#x27;DHCP can supply a host with an address lease and configuration such as a default gateway and DNS servers. It is a configuration service, not the mechanism that forwards ordinary application packets. Static addresses are useful for an initial reproducible lab.&#x27;,&#x27;A client can receive an IP lease but still have an incorrect gateway configuration.&#x27;,&#x27;Record which addresses and routes are static and which are dynamically assigned.&#x27;,&#x27;Is DHCP necessary for your first isolated lab?&#x27;,&#x27;No. Static addressing can simplify the initial experiment; understand DHCP for real home-network deployment.&#x27;,[&#x27;ipv4&#x27;],[&#x27;dns&#x27;,&#x27;routing&#x27;],&#x27;basics&#x27;],
      [&#x27;dns&#x27;,&#x27;DNS&#x27;,&#x27;Names and addresses are different concerns&#x27;,&#x27;DNS resolves names to records, including addresses. It is separate from the route used to reach that address. Name-resolution failure can make an application appear disconnected even when IP connectivity works. DNS alone is not reliable ground truth for what service an encrypted flow carries.&#x27;,&#x27;A server responds by IP while its name fails because name resolution is broken.&#x27;,&#x27;Compare a name-based connection with the equivalent address-based test.&#x27;,&#x27;Does successful DNS resolution prove the server is reachable?&#x27;,&#x27;No. Resolution supplies information; routing, transport and the application still need to work.&#x27;,[&#x27;client-server&#x27;,&#x27;ipv4&#x27;],[&#x27;ports&#x27;,&#x27;metadata&#x27;],&#x27;basics&#x27;],
      [&#x27;mtu&#x27;,&#x27;MTU &amp; MSS&#x27;,&#x27;Packet size can change performance&#x27;,&#x27;MTU limits the IP-packet size supported by a link. TCP MSS concerns TCP payload per segment. Path MTU Discovery helps endpoints adapt to the path. Fragmentation, blocked signalling and encapsulation overhead can affect delivery, so keep packet-size assumptions visible in experiments.&#x27;,&#x27;A tunnel adds headers and can reduce the usable packet size for the inner traffic.&#x27;,&#x27;Record interface MTUs and compare a small packet with a larger controlled test packet.&#x27;,&#x27;Are MTU and TCP MSS identical?&#x27;,&#x27;No. MSS excludes IP and TCP headers, while MTU limits the packet carried by the link.&#x27;,[&#x27;encapsulation&#x27;,&#x27;ipv4&#x27;],[&#x27;quic&#x27;,&#x27;packet-rates&#x27;],&#x27;basics&#x27;],
      [&#x27;nat&#x27;,&#x27;NAT &amp; conntrack&#x27;,&#x27;Address translation changes what you observe&#x27;,&#x27;NAT can rewrite addresses or ports as traffic crosses a boundary. Connection tracking associates packets with connection state, including the reverse direction. Classification before and after translation may see different identifiers. Host fairness depends on retaining a meaningful view of internal devices.&#x27;,&#x27;Several home devices can share one public IPv4 address while their connections remain distinct.&#x27;,&#x27;Sketch one connection’s internal and translated five-tuples and its reverse path.&#x27;,&#x27;Can a public source IP always identify a single household device?&#x27;,&#x27;No. NAT can hide multiple internal devices behind one public address.&#x27;,[&#x27;routing&#x27;,&#x27;ports&#x27;],[&#x27;hooks&#x27;,&#x27;host-fairness&#x27;],&#x27;hooks&#x27;]
    ]},
    {id:&#x27;transport&#x27;,label:&#x27;3. Transport&#x27;,title:&#x27;Understand the traffic you will protect&#x27;,intro:&#x27;Transport behaviour explains why calls, games, streaming and downloads respond differently to congestion. Study how traffic is delivered and controlled before designing categories for it.&#x27;,example:&#x27;A TCP transfer changes its sending behaviour after congestion signals. A fixed-rate UDP test generator may continue at its configured rate.&#x27;,practice:&#x27;Compare a TCP transfer and a controlled UDP workload across the same bottleneck.&#x27;,check:&#x27;Is UDP itself a promise of low latency?&#x27;,answer:&#x27;No. A UDP packet can still wait in queues, be dropped or traverse a slow path.&#x27;,connection:&#x27;Supports meaningful traffic categories, realistic workload generation and correct policy explanations.&#x27;,source:&#x27;tcp&#x27;,items:[
      [&#x27;tcp-udp&#x27;,&#x27;TCP versus UDP&#x27;,&#x27;Delivery services affect application behaviour&#x27;,&#x27;TCP provides a reliable ordered byte stream and transport congestion control. UDP sends datagrams without supplying that complete service; an application may add reliability or congestion control itself. Neither choice removes network delay or guarantees that the application is interactive.&#x27;,&#x27;A video application can use UDP while adapting its own sending rate.&#x27;,&#x27;List which delivery properties a download and a call need.&#x27;,&#x27;Is every UDP flow unresponsive to congestion?&#x27;,&#x27;No. UDP has no built-in TCP-style control, but applications or transports built over UDP can implement their own.&#x27;,[&#x27;layers&#x27;,&#x27;client-server&#x27;],[&#x27;congestion&#x27;,&#x27;quic&#x27;],&#x27;basics&#x27;],
      [&#x27;ports&#x27;,&#x27;Ports &amp; five-tuples&#x27;,&#x27;Identify transport traffic precisely&#x27;,&#x27;Ports identify transport endpoints on hosts. A conventional directional flow key includes source IP, destination IP, source port, destination port and protocol. The reverse direction swaps endpoints. Ports are useful features but do not reliably identify every application.&#x27;,&#x27;Several applications can use TCP port 443; a port-only classifier cannot distinguish them all.&#x27;,&#x27;Write the five-tuple of a test connection and its reverse.&#x27;,&#x27;Why is an IP address alone too coarse for a flow key?&#x27;,&#x27;A host may have many simultaneous connections to different processes and remote endpoints.&#x27;,[&#x27;ipv4&#x27;,&#x27;client-server&#x27;],[&#x27;nat&#x27;,&#x27;metadata&#x27;],&#x27;basics&#x27;],
      [&#x27;reliability&#x27;,&#x27;TCP reliability&#x27;,&#x27;ACKs and retransmissions repair missing data&#x27;,&#x27;TCP numbers stream bytes and uses acknowledgements to track delivery. Lost data can be retransmitted. Ordered delivery means missing earlier bytes can hold later data back from the application. Learn retransmission timeouts and duplicate acknowledgements at a conceptual level.&#x27;,&#x27;A lost part of a download is retransmitted; completion can take longer even if the link rate is unchanged.&#x27;,&#x27;Observe ACKs and a controlled loss event in your test traffic.&#x27;,&#x27;Does reliable delivery mean delivery without delay?&#x27;,&#x27;No. Repair and ordered delivery can add waiting time.&#x27;,[&#x27;tcp-udp&#x27;,&#x27;ports&#x27;],[&#x27;flow-control&#x27;,&#x27;congestion&#x27;],&#x27;basics&#x27;],
      [&#x27;flow-control&#x27;,&#x27;Flow control&#x27;,&#x27;Protect the receiver from excess data&#x27;,&#x27;TCP’s receive window, rwnd, limits outstanding data according to receiver capacity. It is different from the congestion window, cwnd, which addresses network conditions. A slow receiver can limit throughput even when the network has spare capacity.&#x27;,&#x27;A busy receiver may become the bottleneck in a throughput test.&#x27;,&#x27;Explain cwnd and rwnd as two separate restrictions on sending.&#x27;,&#x27;Would increasing router capacity fix every low-throughput transfer?&#x27;,&#x27;No. The receiver, application, host CPU or sender can be limiting it.&#x27;,[&#x27;reliability&#x27;],[&#x27;congestion&#x27;,&#x27;bottlenecks&#x27;],&#x27;tcp&#x27;],
      [&#x27;congestion&#x27;,&#x27;TCP congestion&#x27;,&#x27;The sender reacts to network evidence&#x27;,&#x27;TCP congestion control limits outstanding data using cwnd and changes behaviour as acknowledgements and congestion signals arrive. Learn slow start, congestion avoidance and loss recovery conceptually. CUBIC and BBR use different strategies; a gateway scheduler is a separate mechanism from sender congestion control.&#x27;,&#x27;After capacity falls, a transfer may build a queue before its sending behaviour adapts.&#x27;,&#x27;Describe what a sender may observe after loss, delay growth or ECN signalling.&#x27;,&#x27;Does a router directly set the sender’s congestion window?&#x27;,&#x27;Normally it influences the sender through delivery and congestion signals; cwnd belongs to the sender’s transport implementation.&#x27;,[&#x27;reliability&#x27;,&#x27;flow-control&#x27;],[&#x27;aqm&#x27;,&#x27;capacity&#x27;],&#x27;tcp&#x27;],
      [&#x27;ack-path&#x27;,&#x27;ACKs &amp; both directions&#x27;,&#x27;Downloads depend on the return path too&#x27;,&#x27;Acknowledgements and control messages use the reverse direction. Upload congestion can therefore affect a download or call. Your experiment should model and measure both directions rather than assuming only the direction carrying the large file matters.&#x27;,&#x27;A cloud backup saturates upload while another device downloads data.&#x27;,&#x27;Run simultaneous uploads and downloads while observing latency and useful throughput.&#x27;,&#x27;Why might limiting upload improve a download’s responsiveness?&#x27;,&#x27;It can reduce reverse-path queueing that delays ACKs or interactive control traffic.&#x27;,[&#x27;reliability&#x27;,&#x27;congestion&#x27;],[&#x27;ingress&#x27;,&#x27;experiments&#x27;],&#x27;tests&#x27;],
      [&#x27;quic&#x27;,&#x27;TLS, QUIC &amp; VPNs&#x27;,&#x27;Encryption limits application visibility&#x27;,&#x27;TLS protects application communication. QUIC provides secure transport streams over UDP. VPNs can place different activities inside a tunnel. Visible headers, sizes and timing offer clues, but they do not guarantee exact application identity. Keep an unknown category and confidence.&#x27;,&#x27;One encrypted connection or tunnel can carry traffic that needs different service treatment.&#x27;,&#x27;Identify which metadata your collector can use without reading private payloads.&#x27;,&#x27;Does UDP port 443 prove a flow is gaming?&#x27;,&#x27;No. It can be QUIC traffic from many kinds of applications.&#x27;,[&#x27;tcp-udp&#x27;,&#x27;ports&#x27;],[&#x27;metadata&#x27;,&#x27;confidence&#x27;],&#x27;quic&#x27;],
      [&#x27;applications&#x27;,&#x27;Calls, games &amp; video&#x27;,&#x27;Application needs should drive the policy&#x27;,&#x27;Interactive applications care about delay, variation and timely delivery. Streaming often uses a playback buffer and bursty segment downloads. Bulk transfers care about completion and goodput. These are broad tendencies, not exact labels inferred from one packet.&#x27;,&#x27;A streaming player can download a segment quickly, pause, then request another.&#x27;,&#x27;Write an objective for each of interactive, streaming and bulk traffic.&#x27;,&#x27;Why should a call and a download not always receive identical treatment?&#x27;,&#x27;Their service needs differ. Delay protection can matter more than high bandwidth for an interactive exchange.&#x27;,[&#x27;tcp-udp&#x27;,&#x27;delay&#x27;],[&#x27;scheduling&#x27;,&#x27;intent&#x27;],&#x27;dscp&#x27;]
    ]},
    {id:&#x27;linux&#x27;,label:&#x27;4. Linux lab&#x27;,title:&#x27;Make the theory observable&#x27;,intro:&#x27;Use a Linux VM and small virtual networks to practise. Verify forwarding first, then add measurement and traffic control. Each policy must act on a path that test packets really traverse.&#x27;,example:&#x27;A rule on the wrong interface produces no change even though the configuration command succeeds.&#x27;,practice:&#x27;Build, inspect and reset an isolated client–gateway–server topology.&#x27;,check:&#x27;What proves that an enforcement point is being used?&#x27;,answer:&#x27;The intended packets traverse it, its counters change, and controlled treatment changes produce the expected observations.&#x27;,connection:&#x27;Implements the reference gateway, metadata collection path and enforcement mechanism.&#x27;,source:&#x27;namespaces&#x27;,items:[
      [&#x27;shell&#x27;,&#x27;Linux essentials&#x27;,&#x27;Learn enough Linux to debug the network&#x27;,&#x27;Practise commands, paths, processes, exit codes, permissions and logs. Network configuration may require administrative capabilities. Separate reading state from changing state. A script should check failures and record what happened instead of assuming every command succeeded.&#x27;,&#x27;A failed configuration command must not be logged as an applied policy.&#x27;,&#x27;Run a command, inspect its exit status and save its output with a timestamp.&#x27;,&#x27;Why should a controller check return codes?&#x27;,&#x27;Otherwise it may report a policy that the system never applied.&#x27;,[&#x27;network&#x27;],[&#x27;linux-addresses&#x27;,&#x27;rollback&#x27;],&#x27;tc&#x27;],
      [&#x27;linux-addresses&#x27;,&#x27;Interfaces &amp; routes&#x27;,&#x27;Inspect the actual Linux configuration&#x27;,&#x27;Use ip link and ip addr for interfaces and addresses; ip route and ip -6 route for paths; ip neigh for neighbour state; ss for sockets. Distinguish an interface being up from having an address, a route and a working remote endpoint.&#x27;,&#x27;An interface can be up while the server subnet has no route.&#x27;,&#x27;Read each interface and route in your lab and explain why it exists.&#x27;,&#x27;Does an up interface prove end-to-end connectivity?&#x27;,&#x27;No. Addressing, routing, neighbour discovery, filtering and the remote host still matter.&#x27;,[&#x27;shell&#x27;,&#x27;routing&#x27;],[&#x27;namespaces&#x27;,&#x27;forwarding&#x27;],&#x27;namespaces&#x27;],
      [&#x27;namespaces&#x27;,&#x27;Network namespaces&#x27;,&#x27;Create separate network environments&#x27;,&#x27;A Linux network namespace has its own interfaces, routes, protocol stacks and other networking state. This lets one host represent several virtual network participants. The participants still share the physical machine’s computing resources, so lab performance has host limits.&#x27;,&#x27;Client and gateway namespaces can have separate routing tables.&#x27;,&#x27;Create a minimal namespace lab and inspect routes within each participant.&#x27;,&#x27;Do namespaces give each virtual host unlimited independent CPU?&#x27;,&#x27;No. Networking is isolated, but the participants still run on shared host resources.&#x27;,[&#x27;linux-addresses&#x27;],[&#x27;veth&#x27;,&#x27;linux-lab&#x27;],&#x27;namespaces&#x27;],
      [&#x27;veth&#x27;,&#x27;veth &amp; bridges&#x27;,&#x27;Connect virtual participants&#x27;,&#x27;A veth pair acts like a virtual cable between interfaces. Moving endpoints into different namespaces connects their network environments. A bridge joins link-layer segments like a software switch. A routed gateway is a different role and needs IP forwarding.&#x27;,&#x27;Two client namespaces can attach to a bridge on the LAN side of the gateway.&#x27;,&#x27;Draw which veth endpoint belongs to which namespace.&#x27;,&#x27;Does adding a bridge automatically route between different IP networks?&#x27;,&#x27;No. A bridge forwards at the link layer; routing between networks requires routing configuration.&#x27;,[&#x27;namespaces&#x27;,&#x27;devices&#x27;],[&#x27;forwarding&#x27;,&#x27;linux-lab&#x27;],&#x27;namespaces&#x27;],
      [&#x27;forwarding&#x27;,&#x27;Forwarding &amp; return path&#x27;,&#x27;Turn Linux into a router deliberately&#x27;,&#x27;Forwarding allows packets not addressed to the Linux host itself to continue through it. Routes select paths, while filtering can permit or block them. Check the return direction independently. Keep the first lab routed and simple before introducing NAT.&#x27;,&#x27;A client reaches the gateway, but forwarding is disabled and the remote server is unreachable.&#x27;,&#x27;Trace a request and reply through the gateway’s interfaces.&#x27;,&#x27;Will enabling forwarding automatically create a server’s return route?&#x27;,&#x27;No. Route configuration and forwarding permission solve different problems.&#x27;,[&#x27;routing&#x27;,&#x27;veth&#x27;],[&#x27;hooks&#x27;,&#x27;linux-lab&#x27;],&#x27;hooks&#x27;],
      [&#x27;hooks&#x27;,&#x27;Hooks &amp; marks&#x27;,&#x27;Choose the correct place to apply a rule&#x27;,&#x27;Forwarded packets follow prerouting, forward and postrouting hooks in the IP path. Locally generated traffic follows a different path. Packet marks are Linux metadata; DSCP is carried in the IP header. Connection marks can retain a decision across associated packets. Order and direction matter.&#x27;,&#x27;A rule affecting gateway-originated traffic may miss clients’ forwarded traffic.&#x27;,&#x27;Annotate the packet path with where classification, NAT and marking happen.&#x27;,&#x27;Are a Linux packet mark and DSCP the same field?&#x27;,&#x27;No. One is local packet metadata; the other is part of the IP header. Their policy mapping must be explicit.&#x27;,[&#x27;forwarding&#x27;,&#x27;nat&#x27;],[&#x27;dscp&#x27;,&#x27;tc-objects&#x27;],&#x27;marks&#x27;],
      [&#x27;ingress&#x27;,&#x27;Ingress, egress &amp; IFB&#x27;,&#x27;Direction is relative to an interface&#x27;,&#x27;Ingress means arriving at an interface; egress means leaving it. Linux shaping normally schedules transmission on egress. An IFB redirection can place incoming traffic into a queueing path for shaping. It cannot undo delay or loss already experienced before arrival.&#x27;,&#x27;A home upload leaves the WAN interface; the download enters it.&#x27;,&#x27;Label ingress and egress for both directions on every gateway interface.&#x27;,&#x27;Can shaping an arrived download packet remove its earlier ISP queueing delay?&#x27;,&#x27;No. It can influence subsequent delivery and transport behaviour, but it cannot reverse past delay.&#x27;,[&#x27;forwarding&#x27;,&#x27;ack-path&#x27;],[&#x27;shaping&#x27;,&#x27;tc-objects&#x27;],&#x27;ifb&#x27;],
      [&#x27;linux-lab&#x27;,&#x27;Build the first lab&#x27;,&#x27;Combine forwarding, links and measurement&#x27;,&#x27;Build a client, a Linux gateway and a server. Use separate subnets with clear routes. Prove both directions, run a transfer and inspect counters. Later add an independent WAN-emulator component so the controller and test condition remain separate.&#x27;,&#x27;The emulator changes capacity; your gateway observes and responds without receiving the true rate as an input.&#x27;,&#x27;Save a topology diagram and a script that creates and resets the lab.&#x27;,&#x27;Why keep the WAN emulator separate from the controller?&#x27;,&#x27;It prevents the system from changing or directly reading the condition used to evaluate its adaptation.&#x27;,[&#x27;namespaces&#x27;,&#x27;veth&#x27;,&#x27;forwarding&#x27;],[&#x27;tools&#x27;,&#x27;netem&#x27;,&#x27;experiments&#x27;],&#x27;namespaces&#x27;]
    ]},
    {id:&#x27;measurement&#x27;,label:&#x27;5. Measurement&#x27;,title:&#x27;Measure before you control&#x27;,intro:&#x27;A controller needs trustworthy observations. Learn rates, delay, loss and uncertainty, then collect reproducible evidence. High throughput alone is insufficient to describe responsiveness.&#x27;,example:&#x27;An average RTT can look acceptable while occasional large spikes disrupt an interactive task.&#x27;,practice:&#x27;Collect an idle baseline, saturate a known bottleneck, and compare time-series and tail measurements.&#x27;,check:&#x27;Does one speed-test number describe interactive quality?&#x27;,answer:&#x27;No. You need delay under load, variation, loss and the conditions of the measurement.&#x27;,connection:&#x27;Supplies the dashboard, estimator inputs and acceptance metrics.&#x27;,source:&#x27;tests&#x27;,items:[
      [&#x27;packet-rates&#x27;,&#x27;Bits, bytes &amp; rates&#x27;,&#x27;Keep units and observation intervals explicit&#x27;,&#x27;Bandwidth and throughput are often in bits per second; counters are often bytes. Compute a measured rate from a counter difference over elapsed time, multiplying bytes by eight for bits. Packet rate is another dimension: equal bit rates can involve very different packet-processing loads.&#x27;,&#x27;1 MB/s equals 8 Mbps when MB is decimal.&#x27;,&#x27;Calculate a rate from two byte-counter readings and their timestamps.&#x27;,&#x27;Why can small packets use more CPU at the same Mbps?&#x27;,&#x27;More packets must be processed per second to carry the same amount of data.&#x27;,[&#x27;packets&#x27;],[&#x27;counters&#x27;,&#x27;bottlenecks&#x27;],&#x27;iperf&#x27;],
      [&#x27;delay&#x27;,&#x27;Delay &amp; RTT&#x27;,&#x27;Separate transmission, propagation and waiting&#x27;,&#x27;End-to-end delay includes transmission, propagation, processing and queueing. RTT measures a round trip, not a one-way journey. Compare idle and loaded conditions to look for extra delay, while remembering that the remote path and endpoint can also change.&#x27;,&#x27;A nearby test server and a distant public server have different baseline delays.&#x27;,&#x27;Measure idle RTT, then RTT while a transfer runs.&#x27;,&#x27;Is half of RTT always the true one-way delay?&#x27;,&#x27;No. The two directions may have different routes, queues or processing delays.&#x27;,[&#x27;journey&#x27;,&#x27;packet-rates&#x27;],[&#x27;bufferbloat&#x27;,&#x27;capacity&#x27;],&#x27;tests&#x27;],
      [&#x27;jitter-loss&#x27;,&#x27;Jitter &amp; loss&#x27;,&#x27;Define precisely what the tool reports&#x27;,&#x27;Jitter describes delay variation, but different tools use different definitions. Packet loss counts missing deliveries according to a stated method and waiting threshold. TCP retransmissions and router drops are related observations, not interchangeable application-loss measurements.&#x27;,&#x27;An AQM may drop some packets to improve overall latency and useful delivery.&#x27;,&#x27;Record the jitter definition, loss method and units used in one test.&#x27;,&#x27;Is a router drop counter the same as a call’s packet-loss rate?&#x27;,&#x27;No. They describe different measurement points and traffic populations.&#x27;,[&#x27;delay&#x27;,&#x27;reliability&#x27;],[&#x27;aqm&#x27;,&#x27;tail-stats&#x27;],&#x27;jitter&#x27;],
      [&#x27;bdp&#x27;,&#x27;Bandwidth–delay product&#x27;,&#x27;Data in flight is different from queued data&#x27;,&#x27;Bandwidth–delay product is bandwidth multiplied by RTT with consistent units. It helps reason about how much data can be in flight across a path. Do not confuse it with a recommendation to keep that much extra data waiting in a gateway queue.&#x27;,&#x27;100 Mbps multiplied by 50 ms is 5 megabits, or about 625 kB.&#x27;,&#x27;Compute BDP for two paths with equal bandwidth but different RTTs.&#x27;,&#x27;Does a high BDP mean a router should deliberately maintain a large queue?&#x27;,&#x27;No. Data in flight along the path and extra waiting data in a queue are different.&#x27;,[&#x27;delay&#x27;,&#x27;congestion&#x27;],[&#x27;bufferbloat&#x27;,&#x27;flow-control&#x27;],&#x27;tcp&#x27;],
      [&#x27;counters&#x27;,&#x27;Counters &amp; telemetry&#x27;,&#x27;Measurements need time and context&#x27;,&#x27;Read interface and qdisc counters at known intervals. Store direction, device, units and timestamps. Derive rates from differences; handle resets or recreated queues explicitly. Missing observations must be marked stale rather than silently interpreted as zero traffic.&#x27;,&#x27;Replacing a queue may reset its counters and break a naive rate calculation.&#x27;,&#x27;Save a small time series of bytes, packets, backlog and observation time.&#x27;,&#x27;What should you do with a negative counter difference?&#x27;,&#x27;Check for reset, replacement or parsing issues; do not report a physically negative traffic rate.&#x27;,[&#x27;packet-rates&#x27;,&#x27;linux-addresses&#x27;],[&#x27;tc-objects&#x27;,&#x27;ewma&#x27;],&#x27;tc&#x27;],
      [&#x27;tools&#x27;,&#x27;ping, iperf &amp; Flent&#x27;,&#x27;Use complementary measurement tools&#x27;,&#x27;Ping observes round-trip responses. iperf3 generates controlled transport workloads and measures their performance. Flent combines established load and latency tests. Each tool observes a specific behaviour; none alone measures every aspect of real application experience.&#x27;,&#x27;Flent RRUL loads upload and download while observing latency.&#x27;,&#x27;Run one controlled transfer and collect latency alongside it.&#x27;,&#x27;Why is ping without load insufficient for bufferbloat evaluation?&#x27;,&#x27;Queues may remain empty while idle and grow only when competing traffic loads the bottleneck.&#x27;,[&#x27;linux-lab&#x27;,&#x27;delay&#x27;],[&#x27;experiments&#x27;,&#x27;jitter-loss&#x27;],&#x27;flent&#x27;],
      [&#x27;tail-stats&#x27;,&#x27;Percentiles &amp; repeat runs&#x27;,&#x27;Look beyond one average&#x27;,&#x27;Median describes the middle observation; p95 and p99 describe the upper tail. A time-series plot shows when conditions changed. Repeat runs to observe variation and keep raw data. A percentile value is meaningful only with its sampling method and measurement interval.&#x27;,&#x27;Most packets arrive quickly, but occasional long waits raise p99 and disrupt interaction.&#x27;,&#x27;Plot a test’s RTT over time and calculate its median and p95.&#x27;,&#x27;Can two runs share the same average but have different user experience?&#x27;,&#x27;Yes. One can be steady while the other has disruptive spikes.&#x27;,[&#x27;delay&#x27;,&#x27;jitter-loss&#x27;],[&#x27;experiments&#x27;,&#x27;project-proof&#x27;],&#x27;tests&#x27;],
      [&#x27;bottlenecks&#x27;,&#x27;Find the bottleneck&#x27;,&#x27;Low throughput has several possible causes&#x27;,&#x27;A limiting resource can be the access link, Wi-Fi, a remote service, receiver, host CPU or your test environment. Distinguish capacity from offered load. A quiet 100 Mbps link carrying 5 Mbps is not evidence that the link only supports 5 Mbps.&#x27;,&#x27;A Linux VM can become CPU-limited before an emulated link reaches its nominal rate.&#x27;,&#x27;List three possible explanations for an unexpectedly low test rate and a check for each.&#x27;,&#x27;Can interface traffic volume alone reveal unused capacity?&#x27;,&#x27;No. Low demand leaves the maximum sustainable rate uncertain.&#x27;,[&#x27;packet-rates&#x27;,&#x27;flow-control&#x27;,&#x27;lan-wan&#x27;],[&#x27;capacity&#x27;,&#x27;reproducibility&#x27;],&#x27;tests&#x27;]
    ]},
    {id:&#x27;qos&#x27;,label:&#x27;6. Queues &amp; QoS&#x27;,title:&#x27;Control waiting and sharing&#x27;,intro:&#x27;Classification, scheduling, shaping and queue management have different jobs. Connect their behaviour to application outcomes before choosing a Linux configuration.&#x27;,example:&#x27;A rate limit can move a bottleneck under your control, while fair scheduling and AQM manage competition at that bottleneck.&#x27;,practice:&#x27;Hold the traffic and bottleneck constant while comparing basic queueing with a competent fixed QoS configuration.&#x27;,check:&#x27;What does an improvement over basic FIFO prove?&#x27;,answer:&#x27;It proves the tested configuration improved that case. Compare against established fixed QoS as well to isolate your adaptive controller’s contribution.&#x27;,connection:&#x27;Provides the policy mechanisms that protect interaction while keeping bulk traffic moving.&#x27;,source:&#x27;queues&#x27;,items:[
      [&#x27;bufferbloat&#x27;,&#x27;Bufferbloat&#x27;,&#x27;Excess waiting can dominate the experience&#x27;,&#x27;When arrivals exceed service for long enough, a queue grows. Persistent large queues add delay even when throughput is high. Approximate queueing delay as queued bits divided by service rate. Short bursts and persistent overload need different handling.&#x27;,&#x27;One decimal MB waiting behind a 20 Mbps service rate takes about 400 ms to drain.&#x27;,&#x27;Create load and check whether extra delay rises with queue backlog.&#x27;,&#x27;Can a connection deliver high Mbps and still feel unresponsive?&#x27;,&#x27;Yes. High throughput and excessive queueing delay can occur together.&#x27;,[&#x27;packets&#x27;,&#x27;delay&#x27;],[&#x27;fifo&#x27;,&#x27;aqm&#x27;],&#x27;aqm&#x27;],
      [&#x27;fifo&#x27;,&#x27;FIFO &amp; tail drop&#x27;,&#x27;Scheduling and dropping are separate decisions&#x27;,&#x27;FIFO serves packets in arrival order. Tail drop discards new arrivals when the buffer is full. They are often combined, but they solve different decisions. A queue can use a different scheduling order or an earlier congestion-signalling policy.&#x27;,&#x27;A small interactive packet can wait behind a backlog of bulk packets in one FIFO.&#x27;,&#x27;Draw FIFO service order and show what happens at a full buffer.&#x27;,&#x27;Is FIFO itself a complete description of the dropping policy?&#x27;,&#x27;No. FIFO describes service order; tail drop describes a particular decision about full buffers.&#x27;,[&#x27;bufferbloat&#x27;],[&#x27;scheduling&#x27;,&#x27;aqm&#x27;],&#x27;queues&#x27;],
      [&#x27;scheduling&#x27;,&#x27;Scheduling &amp; fairness&#x27;,&#x27;Choose who receives the next service opportunity&#x27;,&#x27;Strict priority serves a preferred queue first and can starve others. Round robin shares opportunities; weighted schemes express unequal policies. Fair queueing separates flows. DRR accounts for variable packet sizes with service credits. Know the behaviour before tuning weights or priorities.&#x27;,&#x27;One device with many connections can receive more total service under simple per-flow fairness.&#x27;,&#x27;Compare strict priority with a weighted policy in a drawing of three busy queues.&#x27;,&#x27;Why must an important class still be bounded?&#x27;,&#x27;Unbounded preferred traffic can consume service continuously and starve other traffic.&#x27;,[&#x27;fifo&#x27;,&#x27;applications&#x27;],[&#x27;host-fairness&#x27;,&#x27;htb&#x27;],&#x27;queues&#x27;],
      [&#x27;token-bucket&#x27;,&#x27;Token buckets&#x27;,&#x27;Rate and burst are different parameters&#x27;,&#x27;A token bucket accumulates permission to transmit at a configured rate, up to a bucket size. A burst can use stored tokens; long-term behaviour remains rate-limited. Too little burst allowance or excessive buffering can change the intended result.&#x27;,&#x27;A shaped flow may send a short burst faster than its long-term configured rate.&#x27;,&#x27;Explain rate, burst size and waiting time as separate settings.&#x27;,&#x27;Does a 20 Mbps shaper forbid every brief interval above 20 Mbps?&#x27;,&#x27;Not necessarily. Burst behaviour depends on the shaper configuration and time scale.&#x27;,[&#x27;packet-rates&#x27;,&#x27;fifo&#x27;],[&#x27;shaping&#x27;,&#x27;htb&#x27;],&#x27;tbf&#x27;],
      [&#x27;shaping&#x27;,&#x27;Shaping versus policing&#x27;,&#x27;Control transmission or enforce a profile&#x27;,&#x27;Shaping delays transmission to follow a rate profile. Policing checks conformance and may drop or remark traffic that exceeds it. Scheduling chooses which waiting packet goes next. These mechanisms can be combined, but a drop rule is not equivalent to a paced transmission queue.&#x27;,&#x27;A shaper can spread a burst over time; a policer can discard excess packets.&#x27;,&#x27;Choose a mechanism for pacing a gateway’s outgoing connection and explain why.&#x27;,&#x27;Will dropping excess packets always provide the same timing as shaping?&#x27;,&#x27;No. Shaping uses queueing and scheduled transmission; policing does not provide identical pacing.&#x27;,[&#x27;token-bucket&#x27;,&#x27;ingress&#x27;],[&#x27;tc-objects&#x27;,&#x27;aqm&#x27;],&#x27;tc&#x27;],
      [&#x27;aqm&#x27;,&#x27;AQM &amp; ECN&#x27;,&#x27;Signal persistent congestion before buffers stay full&#x27;,&#x27;Active Queue Management decides when to signal congestion, commonly by dropping or marking packets. ECN allows a congestion indication when the path and transport support it. ECN is not a traffic-priority label. AQM works with transport responses and scheduling; it does not create capacity.&#x27;,&#x27;Some congestion marks can accompany lower delay and better application behaviour.&#x27;,&#x27;Explain which observations you would use besides a drop counter to judge success.&#x27;,&#x27;Does zero queue drops always mean a better policy?&#x27;,&#x27;No. A queue can avoid drops while imposing harmful delay. Judge useful delivery, latency and application loss together.&#x27;,[&#x27;congestion&#x27;,&#x27;fifo&#x27;],[&#x27;fq-codel&#x27;,&#x27;dscp&#x27;],&#x27;aqm&#x27;],
      [&#x27;fq-codel&#x27;,&#x27;FQ-CoDel&#x27;,&#x27;Combine flow scheduling and delay management&#x27;,&#x27;FQ-CoDel hashes traffic into flow queues, gives sparse flows useful isolation, and runs CoDel queue management. It helps reduce interference from large flows. It is not the same as a complete integrated link-rate shaper, and its fairness unit is not automatically a household user.&#x27;,&#x27;A sparse interactive flow can receive service without sitting behind an entire large transfer queue.&#x27;,&#x27;Compare fixed FQ-CoDel-based treatment with a basic FIFO case.&#x27;,&#x27;Does choosing FQ-CoDel automatically determine the access link’s capacity?&#x27;,&#x27;No. Capacity estimation and any required shaping are separate design responsibilities.&#x27;,[&#x27;scheduling&#x27;,&#x27;aqm&#x27;],[&#x27;cake&#x27;,&#x27;host-fairness&#x27;],&#x27;fq&#x27;],
      [&#x27;tc-objects&#x27;,&#x27;tc objects&#x27;,&#x27;Translate the policy into Linux mechanisms&#x27;,&#x27;A qdisc defines queueing behaviour. A class subdivides a classful configuration. Filters choose treatment and actions can mark, police or redirect. Handles identify pieces of the configuration. Inspect applied state and statistics instead of assuming a successful-looking command changed the right traffic.&#x27;,&#x27;An HTB hierarchy can have FQ-CoDel leaf queues selected by filters.&#x27;,&#x27;Draw one root, its classes, filters and leaf queues, then inspect their counters.&#x27;,&#x27;What is the difference between a class and a classifier?&#x27;,&#x27;A class is a subdivision of traffic treatment; classification is the decision assigning traffic to treatment.&#x27;,[&#x27;shaping&#x27;,&#x27;hooks&#x27;],[&#x27;htb&#x27;,&#x27;cake&#x27;,&#x27;counters&#x27;],&#x27;tc&#x27;],
      [&#x27;htb&#x27;,&#x27;HTB &amp; class rates&#x27;,&#x27;Allocate class service explicitly&#x27;,&#x27;HTB is a classful bandwidth-control mechanism. Learn rate, ceiling, borrowing, burst and the leaf qdisc. A class’s ability to borrow depends on spare parent capacity. Child configurations must fit a coherent parent budget; exact service still depends on the full setup and traffic.&#x27;,&#x27;A bulk class can borrow unused capacity when interactive traffic is quiet.&#x27;,&#x27;Explain what changes when rate stays fixed but ceiling increases.&#x27;,&#x27;Does a high ceiling create bandwidth when the parent is saturated?&#x27;,&#x27;No. Borrowing requires capacity that the parent can provide.&#x27;,[&#x27;token-bucket&#x27;,&#x27;tc-objects&#x27;],[&#x27;host-fairness&#x27;,&#x27;intent&#x27;],&#x27;htb&#x27;],
      [&#x27;cake&#x27;,&#x27;CAKE&#x27;,&#x27;Study an integrated home-gateway scheduler&#x27;,&#x27;CAKE integrates shaping, queue management, flow isolation and service differentiation. Learn configured bandwidth, host/flow fairness, DiffServ modes, overhead assumptions and statistics. Its class thresholds are not simply fixed bandwidth reservations. Dynamic rate selection still needs a justified approach.&#x27;,&#x27;Your controller can update a CAKE rate while retaining an established scheduling mechanism.&#x27;,&#x27;Inspect a fixed CAKE configuration and explain each option you chose.&#x27;,&#x27;Does enabling CAKE complete the adaptive QoS project?&#x27;,&#x27;No. You still need estimation, intent, confidence, corrections, recovery and measured evaluation.&#x27;,[&#x27;fq-codel&#x27;,&#x27;tc-objects&#x27;],[&#x27;capacity&#x27;,&#x27;dscp&#x27;,&#x27;controller&#x27;],&#x27;cake&#x27;]
    ]},
    {id:&#x27;classification&#x27;,label:&#x27;7. Classify &amp; share&#x27;,title:&#x27;Connect observations to fair policy&#x27;,intro:&#x27;Use allowed metadata to infer broad service needs, expose uncertainty and permit correction. Connect those decisions to bounded priorities, device fairness and temporary user intent.&#x27;,example:&#x27;A work-call preference should expire and should not give an unrelated laptop download unlimited priority.&#x27;,practice:&#x27;Classify a controlled workload, change its treatment, correct a mistake and verify that another device keeps progressing.&#x27;,check:&#x27;Is exact app recognition required for the first useful version?&#x27;,answer:&#x27;No. Broad classes with confidence and a useful unknown fallback can support a credible prototype.&#x27;,connection:&#x27;Implements traffic classification, user intent, fairness and starvation prevention.&#x27;,source:&#x27;dscp&#x27;,items:[
      [&#x27;metadata&#x27;,&#x27;Allowed metadata&#x27;,&#x27;Use clues without reading private payloads&#x27;,&#x27;Useful inputs include protocol, direction, counts, packet lengths, flow duration and timing summaries. Keep collection limited to what the policy needs. An IP address, port or a single small packet is weak evidence of application identity. Privacy includes minimizing stored identifiers as well as avoiding payload inspection.&#x27;,&#x27;A sustained large transfer is a clue for bulk activity, but buffered streaming can look similar.&#x27;,&#x27;Write a collector schema containing only necessary metadata and units.&#x27;,&#x27;Why keep an unknown class?&#x27;,&#x27;Some encrypted or unfamiliar traffic does not support a confident decision from allowed evidence.&#x27;,[&#x27;ports&#x27;,&#x27;quic&#x27;],[&#x27;windows&#x27;,&#x27;confidence&#x27;],&#x27;quic&#x27;],
      [&#x27;windows&#x27;,&#x27;Windows &amp; features&#x27;,&#x27;Summarize behaviour over time&#x27;,&#x27;Group observations into a defined flow and time window. Calculate rates, variability, burstiness, direction ratios and duration using consistent units. Short windows respond quickly but can be noisy; longer windows smooth behaviour but delay recognition. Packet-level train/test mixing can leak the same session across evaluation sets.&#x27;,&#x27;A momentary video segment burst should not automatically become a permanent bulk label.&#x27;,&#x27;Compare the same workload’s features over two window lengths.&#x27;,&#x27;What trade-off changes when the window gets longer?&#x27;,&#x27;Estimates may become steadier, but decisions can react more slowly and combine different behaviours.&#x27;,[&#x27;metadata&#x27;,&#x27;counters&#x27;],[&#x27;ewma&#x27;,&#x27;labels&#x27;],&#x27;tests&#x27;],
      [&#x27;confidence&#x27;,&#x27;Confidence &amp; correction&#x27;,&#x27;Treat a classification as a fallible decision&#x27;,&#x27;Return a category, reason and uncertainty indicator. A heuristic score is not automatically a calibrated probability. Allow correction and define how long it applies. At low confidence, retain fair default service rather than assigning an unsupported extreme priority.&#x27;,&#x27;A flow guessed as bulk is corrected to interactive and its queue treatment changes.&#x27;,&#x27;Create a deliberately ambiguous workload and document the fallback.&#x27;,&#x27;Does a score of 0.8 always mean 80% correctness?&#x27;,&#x27;Only if that probability interpretation has been defined and validated. Otherwise describe it as a rule or model score.&#x27;,[&#x27;metadata&#x27;,&#x27;windows&#x27;],[&#x27;intent&#x27;,&#x27;labels&#x27;],&#x27;tests&#x27;],
      [&#x27;dscp&#x27;,&#x27;DSCP &amp; trust&#x27;,&#x27;Service markings need a local policy&#x27;,&#x27;DSCP expresses requested service treatment in the IP header. It is distinct from ECN congestion information and Linux-local marks. Define which markings you trust, how classification maps to treatment and what happens at boundaries. A marking is not an end-to-end performance guarantee.&#x27;,&#x27;A device marking every transfer as high priority should not monopolize the gateway.&#x27;,&#x27;Map your broad categories to documented local treatments and define an unknown default.&#x27;,&#x27;Will a remote network necessarily honour your DSCP?&#x27;,&#x27;No. Service handling can change across administrative domains; your strongest claim is about your tested enforcement scope.&#x27;,[&#x27;hooks&#x27;,&#x27;aqm&#x27;],[&#x27;cake&#x27;,&#x27;intent&#x27;],&#x27;dscp&#x27;],
      [&#x27;host-fairness&#x27;,&#x27;Device versus flow&#x27;,&#x27;Choose the unit of fairness deliberately&#x27;,&#x27;Per-flow fairness can favour a device that opens many connections. Per-device fairness needs a usable device identity, including awareness of NAT and changing addresses. Compare participants with similar demand when judging equal sharing; a low-rate call need not receive a download’s throughput.&#x27;,&#x27;One laptop opens twenty downloads while a second opens one.&#x27;,&#x27;Test whether the first laptop gains an unintended total advantage.&#x27;,&#x27;Is equal throughput for every application always fair?&#x27;,&#x27;No. Fairness depends on the policy and demand. Also measure useful delivery and starvation.&#x27;,[&#x27;nat&#x27;,&#x27;scheduling&#x27;],[&#x27;htb&#x27;,&#x27;intent&#x27;,&#x27;experiments&#x27;],&#x27;fq&#x27;],
      [&#x27;intent&#x27;,&#x27;Temporary intent&#x27;,&#x27;A preference needs scope, bounds and expiry&#x27;,&#x27;Represent intent with a target, requested treatment, start, expiry and cancellation. Limit its resource effect so other traffic progresses. Prefer identifying the intended traffic when possible; a device-wide preference can otherwise promote an unrelated background transfer from that device.&#x27;,&#x27;Prioritize a laptop’s call for 30 minutes, then restore normal treatment.&#x27;,&#x27;Apply a temporary preference while a second device downloads; test expiry and cancellation.&#x27;,&#x27;Why should intent expire automatically?&#x27;,&#x27;Temporary importance should not silently become a permanent household priority.&#x27;,[&#x27;confidence&#x27;,&#x27;host-fairness&#x27;,&#x27;dscp&#x27;],[&#x27;rollback&#x27;,&#x27;controller&#x27;],&#x27;dscp&#x27;],
      [&#x27;labels&#x27;,&#x27;Ground truth &amp; accuracy&#x27;,&#x27;Evaluate recognition independently&#x27;,&#x27;Use known generated workloads as labels, but keep labels out of classifier inputs. Hold out sessions or conditions, inspect per-class errors and report unknown coverage. A fixed test port can verify plumbing; memorizing it does not establish general recognition. ML is optional and must show useful benefit if used.&#x27;,&#x27;A model scores well on packets from familiar sessions but fails on a new session.&#x27;,&#x27;Create a confusion matrix using held-out workload sessions.&#x27;,&#x27;Why is a random packet split from one session risky?&#x27;,&#x27;Closely related observations can appear in training and testing, inflating the apparent ability to generalize.&#x27;,[&#x27;confidence&#x27;,&#x27;windows&#x27;],[&#x27;experiments&#x27;,&#x27;project-proof&#x27;],&#x27;tests&#x27;]
    ]},
    {id:&#x27;adaptation&#x27;,label:&#x27;8. Adapt &amp; prove&#x27;,title:&#x27;Close the feedback loop&#x27;,intro:&#x27;Combine fresh measurements, uncertainty, a bounded policy and verification. Test whether the resulting service improves, and demonstrate predictable recovery when evidence or enforcement fails.&#x27;,example:&#x27;The emulated WAN drops from 100 to 20 Mbps. Your gateway detects the consequences, adapts, and later recovers capacity without repeated large swings.&#x27;,practice:&#x27;Automate a capacity drop, recovery, wrong classification, intent expiry and an enforcement failure.&#x27;,check:&#x27;What makes a controller different from a one-time configuration script?&#x27;,answer:&#x27;It observes changing conditions, makes bounded decisions, verifies effects and handles failures over time.&#x27;,connection:&#x27;Implements the adaptive engine and provides the evidence requested by the brief.&#x27;,source:&#x27;tests&#x27;,items:[
      [&#x27;capacity&#x27;,&#x27;Estimate capacity&#x27;,&#x27;Sustainable rate is an inference, not a counter&#x27;,&#x27;Combine offered load, delivered rate, delay and queue evidence to estimate a sustainable shaping rate. Track upload and download separately and express uncertainty. Low demand does not reveal the maximum, and a remote delay change is not proof of local congestion.&#x27;,&#x27;A quiet 100 Mbps link carrying 5 Mbps still has unknown spare capacity from counters alone.&#x27;,&#x27;List what additional evidence would support reducing a shaping rate.&#x27;,&#x27;Should the emulator send its true capacity directly to the estimator?&#x27;,&#x27;No. Keep that value for evaluation ground truth if the estimator is supposed to infer conditions.&#x27;,[&#x27;bottlenecks&#x27;,&#x27;delay&#x27;,&#x27;counters&#x27;],[&#x27;ewma&#x27;,&#x27;controller&#x27;],&#x27;autorate&#x27;],
      [&#x27;ewma&#x27;,&#x27;Smoothing &amp; EWMA&#x27;,&#x27;Reduce noise while preserving useful changes&#x27;,&#x27;A moving average summarizes recent observations. EWMA combines the current observation with a previous estimate using a weight. More smoothing can suppress spikes but delay detection. Mark stale data and consider a path’s baseline delay separately from its current loaded delay.&#x27;,&#x27;One delayed probe should not force a dramatic rate change by itself.&#x27;,&#x27;Compare raw and smoothed delay during a short spike and a sustained capacity drop.&#x27;,&#x27;Can heavy smoothing hide a real problem?&#x27;,&#x27;Yes. A response that is too slow may leave queues growing while the estimate catches up.&#x27;,[&#x27;counters&#x27;,&#x27;windows&#x27;],[&#x27;hysteresis&#x27;,&#x27;capacity&#x27;],&#x27;autorate&#x27;],
      [&#x27;hysteresis&#x27;,&#x27;Hysteresis &amp; cooldown&#x27;,&#x27;Avoid unstable switching&#x27;,&#x27;Use distinct conditions for entering and leaving congestion states. A cooldown gives an applied action time to have an observable effect. Bounds and step limits reduce excessive changes. These controls trade adaptation speed against stability and must be tested with changing conditions.&#x27;,&#x27;A controller repeatedly increases and decreases its rate around one noisy threshold.&#x27;,&#x27;Show how separate entry and exit thresholds would change that behaviour.&#x27;,&#x27;Is the fastest reaction to every single observation always best?&#x27;,&#x27;No. Noise-driven reactions can cause oscillation and harm service.&#x27;,[&#x27;ewma&#x27;,&#x27;capacity&#x27;],[&#x27;controller&#x27;,&#x27;experiments&#x27;],&#x27;autorate&#x27;],
      [&#x27;rollback&#x27;,&#x27;State &amp; recovery&#x27;,&#x27;Define what happens when automation fails&#x27;,&#x27;Separate normal, congested, degraded-observation and fallback behaviour. Validate a candidate policy, apply it, then verify actual state. A previous configuration may be unsuitable after capacity changes; define a conservative fallback and report when assumptions fail. Never treat stale telemetry as reliable evidence.&#x27;,&#x27;A policy operation fails while the link is already congested.&#x27;,&#x27;Simulate stale measurements or a rejected policy and check the resulting state.&#x27;,&#x27;Is the last high-rate policy always safe to restore?&#x27;,&#x27;No. Current capacity may now be lower. Recovery must account for current conditions and documented bounds.&#x27;,[&#x27;shell&#x27;,&#x27;intent&#x27;,&#x27;capacity&#x27;],[&#x27;controller&#x27;,&#x27;project-proof&#x27;],&#x27;tests&#x27;],
      [&#x27;controller&#x27;,&#x27;The control loop&#x27;,&#x27;Connect measurement, decision and enforcement&#x27;,&#x27;Collect fresh observations, update estimates, resolve intent and propose a policy. Check bounds and fairness, apply the policy, verify it, and observe the outcome. Record why the decision happened. Keep packet forwarding in the networking stack while higher-level logic uses aggregated observations.&#x27;,&#x27;The controller changes a rate and then checks the installed configuration and subsequent service metrics.&#x27;,&#x27;Draw the complete loop and identify every input, output and failure path.&#x27;,&#x27;Does a successful command prove the policy improved service?&#x27;,&#x27;No. It proves only part of enforcement; evaluate the resulting application and network metrics.&#x27;,[&#x27;tc-objects&#x27;,&#x27;capacity&#x27;,&#x27;hysteresis&#x27;,&#x27;rollback&#x27;],[&#x27;netem&#x27;,&#x27;project-proof&#x27;],&#x27;tests&#x27;],
      [&#x27;netem&#x27;,&#x27;Controlled impairments&#x27;,&#x27;Create repeatable conditions independently&#x27;,&#x27;Use an emulator to introduce documented delay, loss and capacity conditions. Placement, queue configuration and kernel timing affect results. Keep the manipulated bottleneck separate from the gateway policy being evaluated. Save configurations and seeds where applicable.&#x27;,&#x27;A test changes the WAN service rate while the gateway continues observing normally.&#x27;,&#x27;Create a resettable impairment scenario and state where it is applied.&#x27;,&#x27;Why does impairment placement matter?&#x27;,&#x27;Different placements can interact differently with queues, transport behaviour and the measurements you collect.&#x27;,[&#x27;linux-lab&#x27;,&#x27;delay&#x27;],[&#x27;experiments&#x27;,&#x27;reproducibility&#x27;],&#x27;netem&#x27;],
      [&#x27;experiments&#x27;,&#x27;Fair comparisons&#x27;,&#x27;Separate established QoS from your contribution&#x27;,&#x27;Compare a basic baseline, competent fixed QoS and your adaptive version under comparable conditions. Repeat runs, save raw data and report variability. Measure interactive performance alongside bulk progress, fairness, stability and CPU overhead. Add component ablations if you claim a specific model provides the benefit.&#x27;,&#x27;Adaptation helps a variable-rate case while fixed QoS already performs well at stable capacity.&#x27;,&#x27;Automate one scenario across the three configurations.&#x27;,&#x27;What can a comparison only against poor FIFO fail to show?&#x27;,&#x27;It can hide how much improvement comes from an established scheduler rather than your new adaptive logic.&#x27;,[&#x27;tools&#x27;,&#x27;tail-stats&#x27;,&#x27;netem&#x27;,&#x27;labels&#x27;],[&#x27;reproducibility&#x27;,&#x27;project-proof&#x27;],&#x27;tests&#x27;],
      [&#x27;reproducibility&#x27;,&#x27;Reproduce &amp; reset&#x27;,&#x27;Evidence needs a documented environment&#x27;,&#x27;Record OS, kernel, tools, topology, routes, queue settings, workloads and measurement definitions. Include reset and verification steps. Repeat representative IPv6 tests where available. Label synthetic traffic and emulation accurately and document licenses and known limits.&#x27;,&#x27;A second person recreates the same capacity-drop experiment from your scripts and configuration.&#x27;,&#x27;Write a checklist for recreating one result on another Linux machine.&#x27;,&#x27;Does a VM result prove production-router performance?&#x27;,&#x27;No. It establishes behaviour on the tested environment; hardware, drivers, offloads and resource limits need separate validation.&#x27;,[&#x27;linux-lab&#x27;,&#x27;ipv6&#x27;,&#x27;experiments&#x27;],[&#x27;project-proof&#x27;,&#x27;bottlenecks&#x27;],&#x27;tests&#x27;],
      [&#x27;project-proof&#x27;,&#x27;Project readiness&#x27;,&#x27;Demonstrate the complete service outcome&#x27;,&#x27;Show real traffic crossing your gateway, useful metadata classification with confidence and correction, changing-rate adaptation, temporary intent, fairness and recovery. Present latency, jitter, loss, throughput, queue and overhead evidence. AI is optional; if present, show measurable value over deterministic logic.&#x27;,&#x27;A scripted demonstration resets the lab, runs the scenario and produces a comparison report.&#x27;,&#x27;Perform a call-like workload plus bulk transfer, a capacity drop, intent expiry and a failure-recovery test.&#x27;,&#x27;What should a reviewer be able to reproduce?&#x27;,&#x27;The tested condition, applied decisions, measured outcome and important limitations of your implementation.&#x27;,[&#x27;controller&#x27;,&#x27;experiments&#x27;,&#x27;reproducibility&#x27;],[&#x27;journey&#x27;,&#x27;host-fairness&#x27;,&#x27;labels&#x27;],&#x27;tests&#x27;]

  add({id:&#x27;root&#x27;,label:&#x27;Computer networks&#x27;,title:&#x27;Your connected learning path&#x27;,concept:&#x27;Explore the map from fundamentals to a working adaptive QoS project. Each topic includes an explanation, an example, a small exercise and a self-check answer. Prerequisites and related topics connect the ideas across branches. Mark a topic understood when you can explain it and complete its exercise.&#x27;,example:&#x27;Follow one packet from a client, through addressing and transport, into a gateway queue, then connect its delay to a measured policy decision.&#x27;,practice:&#x27;Begin with Foundations. Follow Next topic for a guided route, or select any branch to revisit a gap.&#x27;,question:&#x27;How should you decide whether you have learned a topic?&#x27;,answer:&#x27;Explain it in your own words, predict an example, and verify the prediction with the suggested exercise. Marking progress is your own learning record, not a test score.&#x27;,prereqs:[],related:[&#x27;foundations&#x27;,&#x27;linux&#x27;,&#x27;qos&#x27;],source:&#x27;basics&#x27;,connection:&#x27;The path covers the networking foundations and mechanisms needed for Case Study 3. Advanced routing, full cryptographic implementations and production Wi-Fi tuning can come later.&#x27;,children:sections.map(s=&gt;s.id)});

    const box=map.getBoundingClientRect(),a=center.getBoundingClientRect(),columns=getComputedStyle(q(&#x27;.cn-map-layout&#x27;)).gridTemplateColumns.trim().split(/\s+/).length,narrow=columns&lt;=2,single=columns===1;

        d=&#x27;M &#x27;+sx+&#x27; &#x27;+sy+&#x27; L &#x27;+sx+&#x27; &#x27;+(sy+8)+&#x27; L &#x27;+trunk+&#x27; &#x27;+(sy+8)+&#x27; L &#x27;+trunk+&#x27; &#x27;+ty+&#x27; L &#x27;+tx+&#x27; &#x27;+ty;

    () => {

    }

  delete frame.dataset.srcdoc;
})();
