[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-qos"
version = "0.1.0"
description = "Validated contracts and configuration for a Linux adaptive QoS reference implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.14.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "build==1.6.1", "setuptools==82.0.1", "wheel==0.48.0"]

[project.scripts]
adaptive-qos = "adaptive_qos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
